<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="220"
        fill="#324C4B" />

  <!-- Grid parameters:
       tile size ~190, gap ~32, 3x3 grid -->
  <!-- Row 1 -->
  <rect x="195" y="195" width="190" height="190" rx="32"
        fill="#F3EEE6" />
  <rect x="417" y="195" width="190" height="190" rx="32"
        fill="#F3EEE6" />
  <rect x="639" y="195" width="190" height="190" rx="32"
        fill="#F3EEE6" />

  <!-- Row 2 -->
  <rect x="195" y="417" width="190" height="190" rx="32"
        fill="#607C6B" /> 
  <rect x="417" y="417" width="190" height="190" rx="32"
        fill="#F3EEE6" />
  <rect x="639" y="417" width="190" height="190" rx="32"
        fill="#D1B66A" /> <!-- 'present' -->

  <!-- Row 3 -->
  <rect x="195" y="639" width="190" height="190" rx="32"
        fill="#425A57" /> <!-- 'wrong' accent -->
  <rect x="417" y="639" width="190" height="190" rx="32"
        fill="#607C6B" />
  <rect x="639" y="639" width="190" height="190" rx="32"
        fill="#F3EEE6" />
</svg>
